baseURL = 'http://localhost:1313/'
languageCode = 'en-us'
title = 'jugaad'
theme = 'hextra'

[params]
  # Hextra specific parameters
  description = "AI, MLE & Software"
  displayUpdatedDate = true
  dateFormat = "2006-01-02"

  [params.navbar]
    displayTitle = true
    displayLogo = true

    [params.navbar.logo]
      path = "/favicon.png"
      dark = "/favicon.png"
      width = 32
      height = 32
  
  # Theme toggle
  themeToggle = true
  
  # Code copy
  codeCopyButton = true
  
  # Reading time
  readingTime = true
  
  # Breadcrumb
  breadcrumb = true
  
  # Edit page
  editPage = true
  editPageURL = "https://github.com/ad-sngh/jugaad/edit/main/content/"

[params.assets]
favicon = "/favicon.png"
favicon16x16 = "/favicon-16x16.png"
favicon32x32 = "/favicon-32x32.png"
apple_touch_icon = "/apple-touch-icon.png"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "github-dark"
    lineNos = true

# Search configuration for Hextra
[outputs]
home = ["HTML", "RSS", "JSON"]

[menu]
  [[menu.main]]
    name = 'Home'
    pageRef = '/'
    weight = 10
  [[menu.main]]
    name = 'About'
    pageRef = '/about'
    weight = 20
  [[menu.main]]
    name = 'Blog'
    pageRef = '/blog'
    weight = 30
  [[menu.main]]
    name = 'Learning Path'
    pageRef = '/learning-path'
    weight = 40
